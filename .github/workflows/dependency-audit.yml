name: dependency-audit

# Runs after the fact, never on a pull request: it must not slow the
# review of a change. A pinned dependency that gains an advisory is
# caught here and reported to the maintainer, who is assigned to the
# issue and so notified by GitHub.
on:
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches:
      - main
    paths:
      - 'native/*/Cargo.lock'
  # track-core-main moves the lock files with the workflow token, and a
  # push made with that token starts no other workflow; its completion
  # does. The checkout then takes main with the move merged.
  workflow_run:
    workflows:
      - track-core-main
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  MAINTAINER: petri-koistinen-refineid

jobs:
  audit:
    name: Audit the lock files against the RustSec advisory database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit@0.22.2

      # Every native crate's lock file, so a new crate is audited without
      # being listed here.
      - name: Audit every lock file
        run: |
          status=0
          found=0
          for lock in native/*/Cargo.lock; do
            [ -f "$lock" ] || continue
            found=1
            echo "::group::$lock"
            cargo audit --file "$lock" || status=1
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No native/*/Cargo.lock to audit" >&2
            status=1
          fi
          exit $status

      # Any failed step, the install included, reaches the maintainer:
      # one open issue, assigned again with every further failure.
      - name: Report a failed audit to the maintainer
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create dependency-audit --description 'The dependency advisory audit failed' --color B60205 --force --repo "$REPO"
          number=$(gh issue list --repo "$REPO" --label dependency-audit --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" --title 'Dependency audit failed' --label dependency-audit --assignee "$MAINTAINER" \
              --body "The advisory audit failed. See the run: $RUN_URL"
          else
            gh issue edit "$number" --repo "$REPO" --add-assignee "$MAINTAINER"
            gh issue comment "$number" --repo "$REPO" --body "The advisory audit failed again: $RUN_URL"
          fi
