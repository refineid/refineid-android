[package]
name = "refineid-rapp-android"
description = "Android shared library and Kotlin binding generator for the shared RAPP core"
version = "26.9.12"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

# UniFFI's Kotlin binding loads the protocol through a JNI shared object, so
# this crate exists to produce one. The protocol itself is not implemented
# here and must not be: refineid-rapp in the shared Rust repository is the
# authority for RAPP framing, transitions, roles, failure policy, and
# cryptography. This crate links that crate's UniFFI scaffolding into a
# cdylib, which is the one thing the library crate cannot produce for Android
# on its own while its own crate-type is rlib and staticlib.
# The generated Kotlin binding loads its Rust side by the scaffolding crate's
# own name, so the shared object must be librefineid_rapp.so even though
# this wrapper crate is what produces it.
[lib]
name = "refineid_rapp"
crate-type = ["cdylib"]

[dependencies]
refineid-rapp = { git = "https://github.com/RefineID/refineid-core.git", branch = "main", features = ["bindings"] }
uniffi = "0.32"

# The same sibling-checkout pattern the refineid-android-core crate uses
# for the other refineid-core crates.
[patch."https://github.com/RefineID/refineid-core.git"]
refineid-rapp = { path = "../../../refineid-core/crates/rapp" }

[[bin]]
name = "refineid-uniffi-bindgen-kotlin"
path = "src/bin/refineid-uniffi-bindgen-kotlin.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
